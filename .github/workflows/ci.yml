name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Testes
        run: npm run test:run

      - name: Build de produção
        run: npm run build
        env:
          # Vite embute env no build; use o mesmo valor do ambiente dev em produção de preview.
          VITE_API_URL: ${{ vars.VITE_API_URL_DEV || 'https://api-dev.example.com/api' }}
          VITE_DEFAULT_WORKSPACE_ID: ${{ vars.VITE_DEFAULT_WORKSPACE_ID || '00000000-0000-0000-0000-000000000001' }}

      - name: Upload do dist (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
