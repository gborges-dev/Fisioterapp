# Blueprint Render — Fisioterapp front (PROD static site)
# https://render.com/docs/blueprint-spec
#
# Configure VITE_API_URL com a URL pública da API Render após deploy da API.

services:
  - type: web
    name: fisioterapp
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://fisioterapp-api.onrender.com/api
      - key: VITE_DEFAULT_WORKSPACE_ID
        value: 00000000-0000-0000-0000-000000000001
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
